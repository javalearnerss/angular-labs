<header class="header">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-icon">
      <span class="book-left"></span>
      <span class="book-right"></span>
    </div>

    <span class="logo-text">
      Book<span>Store</span>
    </span>
  </div>


  <!-- Navigation -->
  <nav class="navigation">

    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active">

      {{ item.label }}

    </a>

  </nav>


  <!-- Search -->
  <div class="search-container">

    <div class="search-icon">
      <svg
        width="19"
        height="19"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>

      </svg>
    </div>

    <input
      type="text"
      placeholder="Search books, authors, ISBN..."
      [(ngModel)]="searchText"
      (keyup.enter)="searchBooks()">

    <button
      class="search-button"
      type="button"
      (click)="searchBooks()">

      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>

      </svg>

    </button>

  </div>


  <!-- Header Actions -->
  <div class="header-actions">

    <!-- Cart -->
    <button class="icon-button">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <circle cx="9" cy="20" r="1"></circle>
        <circle cx="18" cy="20" r="1"></circle>

        <path d="M3 4h2l2.5 11h10l2-8H6"></path>

      </svg>

      <span class="badge">{{ cartCount }}</span>

    </button>


    <!-- Wishlist -->
    <button class="icon-button">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <path
          d="M20.8 8.8
             C20.8 13.5 12 19 12 19
             S3.2 13.5 3.2 8.8
             C3.2 6.1 5.2 4 7.8 4
             C9.5 4 11 4.9 12 6.2
             C13 4.9 14.5 4 16.2 4
             C18.8 4 20.8 6.1 20.8 8.8Z">
        </path>

      </svg>

      <span class="badge">{{ wishlistCount }}</span>

    </button>


    <!-- Notifications -->
    <button class="icon-button">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8">

        <path
          d="M18 8
             C18 5 15.8 3 12 3
             C8.2 3 6 5 6 8
             C6 14 4 16 4 17
             H20
             C20 16 18 14 18 8Z">
        </path>

        <path d="M10 21h4"></path>

      </svg>

      <span class="badge">{{ notificationCount }}</span>

    </button>

  </div>


  <!-- User -->
  <div class="user-menu">

    <img
      src="images/user.png"
      alt="John Doe"
      class="user-avatar">

    <span class="user-name">
      John Doe
    </span>

    <svg
      class="dropdown-icon"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2">

      <polyline points="6 9 12 15 18 9"></polyline>

    </svg>

  </div>

</header>
