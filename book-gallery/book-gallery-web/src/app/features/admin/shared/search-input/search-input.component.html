<section class="search-toolbar">

  <!-- Search -->
  <div class="search-box">

    <svg
      class="search-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M20 20L16 16"></path>
    </svg>

    <input
      type="text"
      placeholder="Search books by title, author or ISBN..." [formControl]="searchControl"
    />

  </div>


  <!-- Category -->
  <select class="filter-select" [formControl]="categoryControl">
    <option value="0">All Categories</option>
    @for (category of categories; track category.id) {
      <option [value]="category.id">{{category.name}}</option>
    }
  </select>


  <!-- Status -->
  <select class="filter-select status-select" [formControl]="bookStatusControl">
    <option value="All">All</option>
    <option value="active">Active</option>
    <option value="out-of-stock">Out of Stock</option>
  </select>


  <!-- Sort -->
  <div class="sort-container">

    <label for="sort">
      Sort by:
    </label>

    <select id="sort" class="sort-select" [formControl]="sortingControl">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
      <option value="price-low">Price: Low to High</option>
      <option value="price-high">Price: High to Low</option>
      <option value="name">Name</option>
    </select>

  </div>

</section>

@if(errorMessage){
  <p role="alert">{{errorMessage}}</p>
}
