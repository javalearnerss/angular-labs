<div class="pagination-container">

  <!-- Showing information -->
  <div class="pagination-info">
    Showing <strong>1</strong> to <strong>10</strong> of <strong>50</strong> books
  </div>

  <!-- Pagination controls -->
  <div class="pagination-controls">

    <!-- Previous -->
    <button
      type="button"
      class="pagination-button arrow"
      aria-label="Previous page">
      ‹
    </button>

    <!-- Pages -->
    <button
      type="button"
      class="pagination-button active">
      1
    </button>

    <button
      type="button"
      class="pagination-button">
      2
    </button>

    <button
      type="button"
      class="pagination-button">
      3
    </button>

    <button
      type="button"
      class="pagination-button">
      4
    </button>

    <span class="ellipsis">
      ...
    </span>

    <button
      type="button"
      class="pagination-button">
      10
    </button>

    <!-- Next -->
    <button
      type="button"
      class="pagination-button arrow"
      aria-label="Next page">
      ›
    </button>

  </div>

</div>
