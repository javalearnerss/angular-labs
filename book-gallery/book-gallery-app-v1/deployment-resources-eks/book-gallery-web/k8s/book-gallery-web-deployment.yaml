apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-gallery-web
  namespace: book-gallery-dev
  labels:
    app: book-gallery-web
    version: v1

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: book-gallery-web
      version: v1

  template:
    metadata:
      labels:
        app: book-gallery-web
        version: v1

    spec:
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 0

      containers:
        - name: book-gallery-web-container
          image: 336042380202.dkr.ecr.ap-south-1.amazonaws.com/dev/book-gallery-web:v1
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

          readinessProbe:
            httpGet:
              path: "/"
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: "/"
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3