<div class="price-filter">

  <h3 class="filter-title">Price Range</h3>

  <div class="price-inputs">

    <div class="price-input">
      <span>₹</span>
      <input
        type="number"
        placeholder="Min"
        [(ngModel)]="minPrice">
    </div>

    <span class="separator">–</span>

    <div class="price-input">
      <span>₹</span>
      <input
        type="number"
        placeholder="Max"
        [(ngModel)]="maxPrice">
    </div>

  </div>

  <input
    type="range"
    class="price-slider"
    min="0"
    max="5000"
    step="100"
    [(ngModel)]="maxPrice">

  <div class="price-range-labels">
    <span>₹0</span>
    <span>₹5,000+</span>
  </div>

</div>
