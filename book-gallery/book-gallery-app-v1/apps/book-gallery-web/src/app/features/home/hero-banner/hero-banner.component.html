<section class="hero-banner">

  <!-- Hero Image -->
  <div class="hero-image">
    <img
      src="images/hero-books.png"
      alt="Stack of popular books with a plant">
  </div>

  <!-- Left Arrow -->
  <button
    class="hero-arrow hero-arrow-left"
    aria-label="Previous slide">
    <span>‹</span>
  </button>

  <!-- Hero Content -->
  <div class="hero-content">

    <p class="hero-subtitle">
      GOOD BOOKS. BRIGHTER MINDS.
    </p>

    <h1>
      Find Your Next
      <span>Great Read</span>
    </h1>

    <p class="hero-description">
      Explore thousands of books across all genres.<br>
      From bestsellers to hidden gems — there’s something for everyone.
    </p>

    <button class="shop-button">
      Shop Now
      <span>→</span>
    </button>

  </div>

  <!-- Right Arrow -->
  <button
    class="hero-arrow hero-arrow-right"
    aria-label="Next slide">
    <span>›</span>
  </button>

  <!-- Carousel Indicators -->
  <div class="hero-indicators">

    <button
      class="indicator active"
      aria-label="Slide 1">
    </button>

    <button
      class="indicator"
      aria-label="Slide 2">
    </button>

    <button
      class="indicator"
      aria-label="Slide 3">
    </button>

    <button
      class="indicator"
      aria-label="Slide 4">
    </button>

    <button
      class="indicator"
      aria-label="Slide 5">
    </button>

  </div>

</section>
