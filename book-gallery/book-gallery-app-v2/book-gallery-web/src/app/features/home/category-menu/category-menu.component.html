<section class="category-section" aria-labelledby="category-title">
  <div class="category-header">
    <div>
      <span class="section-kicker">FOLLOW YOUR CURIOSITY</span>
      <h2 id="category-title">Find your kind of story</h2>
    </div>
    <a routerLink="/books" class="view-all">All books <span aria-hidden="true">→</span></a>
  </div>

  <div class="category-list">
    @for (category of categories; track category.name) {
      <a
        class="category-card"
        [routerLink]="['/books']"
        [queryParams]="{ categories: category.name }"
      >
        <span class="category-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v18H7.5A2.5 2.5 0 0 0 5 22V4.5Z" />
            <path d="M5 5v17M9 7h7M9 11h6" />
          </svg>
        </span>
        <span class="category-name">{{ category.name }}</span>
        <span class="category-arrow" aria-hidden="true">↗</span>
      </a>
    }
  </div>
</section>
