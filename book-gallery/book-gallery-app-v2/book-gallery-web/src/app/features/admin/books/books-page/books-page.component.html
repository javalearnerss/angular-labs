<div class="books-page">

    <!-- Page Header -->
    <app-page-header title="Books" description="Manage your book inventory">
        <button class="blue-button" type="button" (click)="goToAddBook()">
            <span class="button-text">
                {{buttonText}}
            </span>
        </button>
    </app-page-header>

    <!-- Search / Filters / Sort -->
    <app-search-input
        (searchBooks)="onSearchBooks($event)"
        (searchCriteriaChange)="onSearchCriteriaChanged($event)"
        (searchFailed)="onSearchFailed($event)"></app-search-input>

    <!-- Books Table -->
    @if(isLoading){
    <p role="status">Loading books...</p>
    } @else if(errorMessage){
    <p role="alert">{{errorMessage}}</p>
    } @else {
    <app-data-table [books]="books" [currentPageNumber]="currentPageNumber" [pageSize]="pageSize" >
        <app-table-column header="Image" field="image"></app-table-column>
        <app-table-column header="Title" field="title"></app-table-column>
        <app-table-column header="Author" field="author"></app-table-column>
        <app-table-column header="Category" field="category"></app-table-column>
        <app-table-column header="Price" field="price"></app-table-column>
        <app-table-column header="Stock" field="stock"></app-table-column>
        <app-table-column header="Status" field="status"></app-table-column>
        <app-table-column header="Actions" field="actions"><button class="edit-button" >Edit</button>
          <button class="delete-button">Delete</button></app-table-column>
    </app-data-table>
    }

    <!-- Pagination -->
    <app-pagination (pageChanged)="onPageChanged($event)" [currentPageNumber]="currentPageNumber" [totalPages]="totalPages"></app-pagination>

</div>
