spring.application.name=book-gallery-server
server.port=9030

logging.level.org.springframework.web=DEBUG

app.cors.allowed-origin=http://localhost:4200

# When JWT_SECRET_ID is set, keys are loaded from Secrets Manager and refreshed
# without restarting the application. Local key environment variables are fallback only.
jwt.secret-id=${JWT_SECRET_ID:}
jwt.secret.refresh-interval-ms=${JWT_SECRET_REFRESH_INTERVAL_MS:30000}
jwt.current-secret=${JWT_CURRENT_SECRET:${jwt.secret:${JWT_SECRET:}}}
jwt.previous-secret=${JWT_PREVIOUS_SECRET:}

spring.datasource.url=jdbc:mysql://localhost:3306/bookstore
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Dspace123#

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
book-gallery.upload-dir=${BOOK_GALLERY_UPLOAD_DIR:src/main/resources/static/images/books}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB




